  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

p;\n  src: url(\"5525b08d-3105-4a6f-a544-f27c27e10711\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ca42b399-fd1e-41f4-8fa6-9c6cb4d0e667\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   TCHILLA ADMIN — DESIGN SYSTEM\n   Tokens + componentes. Tema claro · densidade compacta.\n   Estilo (minimal/expressivo), densidade, raio e acento\n   são controlados por [data-*] no <html> via painel Tweaks.\n   ============================================================ */\n\n/* ----------------------- TOKENS ----------------------- */\n:root{\n  /* marca */\n  --navy:#0E2A42; --navy-700:#1C3A52; --navy-800:#122B40; --navy-900:#0A2030;\n  --blue:#14AAE9; --blue-50:#E8F7FE; --blue-100:#C2EBFB; --blue-200:#8FD9F7;\n  --blue-600:#0E8FCB; --blue-700:#0A6F9E; --blue-800:#0A567A;\n  --pink:#FF4D8D; --pink-50:#FFF1F6; --pink-100:#FFE3EC; --pink-200:#FFC6D9;\n  --pink-400:#FF6FA0; --pink-600:#ED2F74; --pink-700:#C81E5E; --pink-800:#A41A4F;\n\n  /* neutros quentes */\n  --gray-25:#FBFAF9; --gray-50:#F6F5F3; --gray-100:#EFEDEA; --gray-150:#E9E6E2;\n  --gray-200:#E2DFDA; --gray-300:#D2CEC8; --gray-400:#ABA69E; --gray-500:#827D75;\n  --gray-600:#615C55; --gray-700:#47433D; --gray-800:#2F2C27; --gray-900:#1C1A17;\n\n  /* semânticos */\n  --bg:var(--gray-50);\n  --surface:#FFFFFF;\n  --surface-2:var(--gray-25);\n  --surface-3:var(--gray-100);\n  --border:var(--gray-200);\n  --border-strong:var(--gray-300);\n  --text:var(--gray-900);\n  --text-2:var(--gray-600);\n  --text-3:var(--gray-500);\n  --heading:var(--navy);\n\n  /* ação / marca */\n  --primary:var(--blue);          /* fundo de ação */\n  --primary-fg:var(--navy);       /* texto sobre ação (acessível) */\n  --primary-hover:#0F97D0;\n  --primary-press:#0E8FCB;\n  --ring:rgba(20,170,233,.40);    /* foco azul Tchilla */\n  --accent:var(--pink);           /* acento pontual */\n  --accent-fg:var(--pink-700);\n  --accent-bg:var(--pink-50);\n  --link:var(--blue-700);\n\n  /* status */\n  --success:#1F8A5B; --success-bg:#E7F6EE; --success-fg:#136B45; --success-bd:#BFE6CF;\n  --warning:#C07C12; --warning-bg:#FBF1DB; --warning-fg:#8A5A12; --warning-bd:#EFD9A8;\n  --danger:#C0392B;  --danger-bg:#FBEAE8;  --danger-fg:#9A2A20;  --danger-bd:#EFC9C4;\n  --info:#0A6F9E;    --info-bg:#E8F7FE;     --info-fg:#075066;    --info-bd:#BFE4F4;\n  --neutral-bg:var(--gray-100); --neutral-fg:var(--gray-700); --neutral-bd:var(--gray-200);\n\n  /* raio (base ajustável por Tweak) */\n  --radius-base:8px;\n  --r-xs:calc(var(--radius-base) * .375);\n  --r-sm:calc(var(--radius-base) * .625);\n  --r-md:var(--radius-base);\n  --r-lg:calc(var(--radius-base) * 1.5);\n  --r-xl:calc(var(--radius-base) * 2.25);\n  --r-full:999px;\n\n  /* sombra */\n  --shadow-xs:0 1px 2px rgba(14,42,66,.06);\n  --shadow-sm:0 1px 3px rgba(14,42,66,.08),0 1px 2px rgba(14,42,66,.05);\n  --shadow-md:0 4px 12px -2px rgba(14,42,66,.12),0 2px 6px -2px rgba(14,42,66,.07);\n  --shadow-lg:0 16px 40px -12px rgba(14,42,66,.22),0 6px 14px -8px rgba(14,42,66,.12);\n  --shadow-pink:0 10px 28px -10px rgba(255,77,141,.45);\n\n  /* densidade (sobrescrita por [data-density]) */\n  --row-h:34px; --control-h:32px; --control-h-sm:26px; --control-h-lg:40px;\n  --pad-x:11px; --font-ui:13px; --font-sm:12px; --gap:8px;\n\n  /* tipo */\n  --display:'Sora',system-ui,sans-serif;\n  --text-font:'Hanken Grotesk',system-ui,sans-serif;\n  --mono:'Space Mono',ui-monospace,monospace;\n}\n\n[data-density=\"comfy\"]{\n  --row-h:44px; --control-h:40px; --control-h-sm:32px; --control-h-lg:48px;\n  --pad-x:15px; --font-ui:14px; --font-sm:13px; --gap:12px;\n}\n\n/* ----- ESTILO EXPRESSIVO: rosa mais presente, formas mais suaves ----- */\n[data-style=\"expressive\"]{\n  --shadow-sm:0 2px 6px rgba(14,42,66,.10);\n  --shadow-md:0 8px 22px -6px rgba(14,42,66,.16),0 3px 8px -4px rgba(255,77,141,.10);\n  --shadow-lg:0 24px 56px -16px rgba(14,42,66,.28),0 8px 20px -10px rgba(255,77,141,.20);\n}\n\n/* ----------------------- BASE ----------------------- */\n*{box-sizing:border-box;}\nhtml,body{margin:0;}\nbody{\n  background:var(--bg);color:var(--text);\n  font-family:var(--text-font);font-size:var(--font-ui);line-height:1.45;\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;\n}\nh1,h2,h3,h4,p{margin:0;}\na{color:var(--link);text-decoration:none;}\n::selection{background:var(--pink-100);color:var(--pink-800);}\n.mono{font-family:var(--mono);}\n.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-feature-settings:\"tnum\";}\n\n/* ----------------------- APP SHELL ----------------------- */\n.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;}\n\n/* sidebar */\n.side{\n  position:sticky;top:0;height:100vh;background:var(--navy);color:#cfe0ee;\n  display:flex;flex-direction:column;padding:0;overflow:hidden;\n}\n.side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08);}\n.side-brand img{height:30px;width:auto;}\n.side-brand .nm{font-family:var(--display);font-weight:700;font-size:16px;color:#fff;letter-spacing:-.01em;}\n.side-brand .nm small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.22em;color:var(--pink);text-transform:uppercase;margin-top:1px;}\n.side-scroll{flex:1;overflow-y:auto;padding:10px 10px 24px;}\n.side-scroll::-webkit-scrollbar{width:8px;}\n.side-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-rad hadow-xs);}\n.btn-secondary:hover{background:var(--gray-50);border-color:var(--gray-400);}\n.btn-ghost{background:transparent;color:var(--text-2);}\n.btn-ghost:hover{background:var(--gray-100);color:var(--text);}\n.btn-danger{background:var(--danger);color:#fff;}\n.btn-danger:hover{background:#a8312553;background:#A83125;}\n.btn-dark{background:var(--navy);color:#fff;}\n.btn-dark:hover{background:var(--navy-700);}\n.btn:disabled,.btn.is-disabled{opacity:.45;cursor:not-allowed;pointer-events:none;}\n.btn-icon{width:var(--control-h);padding:0;}\n.btn-icon.sm{width:var(--control-h-sm);}\n.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring);}\n[data-style=\"expressive\"] .btn-primary{box-shadow:0 6px 16px -8px rgba(20,170,233,.6);}\n[data-style=\"expressive\"] .btn-accent{box-shadow:var(--shadow-pink);}\n\n.btn-group{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-xs);}\n.btn-group button{height:var(--control-h);padding:0 13px;border:0;border-right:1px solid var(--border);background:transparent;font:inherit;font-weight:600;font-size:13px;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}\n.btn-group button:last-child{border-right:0;}\n.btn-group button:hover{background:var(--gray-50);}\n.btn-group button.on{background:var(--blue-50);color:var(--blue-800);}\n\n/* ----------------------- FORMS ----------------------- */\n.field{display:flex;flex-direction:column;gap:6px;}\n.label{font-size:12.5px;font-weight:600;color:var(--text);display:flex;gap:6px;align-items:center;}\n.label .req{color:var(--danger);}\n.label .opt{font-weight:400;color:var(--text-3);font-size:11.5px;}\n.hint{font-size:11.5px;color:var(--text-3);}\n.hint.err{color:var(--danger-fg);}\n.hint.ok{color:var(--success-fg);}\n.input,.select,.textarea{\n  height:var(--control-h);width:100%;padding:0 var(--pad-x);background:var(--surface);\n  border:1px solid var(--b ;justify-content:space-between;gap:10px;}\n.divider{height:1px;background:var(--border);margin:4px 0;}\n.kbd{font-family:var(--mono);font-size:10.5px;background:var(--surface);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text-2);}\n.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;font-size:13px;}\n.dl dt{color:var(--text-3);}\n.dl dd{margin:0;color:var(--text);font-weight:500;text-align:right;}\n<\u002Fstyle>\n<style>\n  body{background:var(--gray-50);}\n  .doc{max-width:920px;margin:0 auto;padding:0 28px 100px;}\n  /* brand header */\n  .doc-top{display:flex;align-items:center;gap:12px;padding:20px 0 18px;border-bottom:1px solid var(--border);margin-bottom:34px;position:sticky;top:0;background:linear-gradient(var(--gray-50),var(--gray-50) 80%,rgba(246,245,243,0));z-index:10;}\n  .doc-top img{height:30px;}\n  .doc-top .nm{font-family:var(--display);font-weight:700;font-size:15px;color:var(--navy);}\n  .doc-top .nm small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--accent-fg);text-transform:uppercase;}\n  .doc-top .pg{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3);}\n\n  .cover{padding:14px 0 26px;}\n  .cover .ey{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-fg);font-weight:700;}\n  .cover h1{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.03em;color:var(--navy);margin-top:12px;line-height:1.02;}\n  .cover p{font-size:16px;color:var(--text-2);max-width:62ch;margin-top:14px;line-height:1.55;}\n\n  .h-sec{display:flex;align-items:baseline;gap:12px;margin:54px 0 18px;padding-bottom:11px;border-bottom:2px solid var(--navy);}\n  .h-sec .n{font-family:var(--mono);font-size:13px;color:var(--accent-fg);font-weight:700;}\n  .h-sec h2{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:-.02em;color:var(--navy);}\n\n  /* principles */\n  .principles{display:grid;grid-template-columns:1fr 1fr;gap:14px;}\n  .princ{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 19px;box-shadow:var(--shadow-xs);position:relative;overflow:hidden;}\n  .princ::before{content:attr(data-n);position:absolute;top:-10px;right:6px;font-family:var(--display);font-weight:800;font-size:64px;color:var(--gray-100);line-height:1;}\n  .princ .pt{font-family:var(--display);font-weight:700;font-size:17px;color:var(--navy);position:relative;}\n  .princ .pd{font-size:13.5px;color:var(--text-2);line-height:1.55;margin-top:7px;position:relative;}\n  .princ .pk{display:inline-flex;align-items:center;gap:6px;margin-top:11px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--accent-fg);text-transform:uppercase;font-weight:700;position:relative;}\n  .princ .pk::before{content:\"\";width:16px;height:2px;background:var(--accent);}\n\n  /* rule */\n  .rule{margin-top:24px;}\n  .rule-h{display:flex;align-items:flex-start;gap:12px;}\n  .rule-h .rn{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;background:var(--navy);border-radius:var(--r-sm);padding:3px 8px;flex:none;margin-top:2px;}\n  .rule-h .rt{font-family:var(--display);font-weight:600;font-size:18px;color:var(--navy);letter-spacing:-.01em;}\n  .rule-h .rp{font-size:14px;color:var(--text-2);line-height:1.55;margin-top:5px;max-width:74ch;}\n\n  .dd{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}\n  .ddc{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);}\n  .ddc .hd{display:flex;align-items:center;gap:7px;padding:8px 13px;font-size:12px;font-weight:700;font-family:var(--text-font);}\n  .ddc.do .hd{background:var(--success-bg);color:var(--success-fg);border-bottom:1px solid var(--success-bd);}\n  .ddc.dont .hd{background:var(--danger-bg);color:var(--danger-fg);border-bottom:1px solid var(--danger-bd);}\n  .ddc .hd svg{width:15px;height:15px;}\n  .ddc .bd{padding:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:96px;}\n  .ddc .bd.col{flex-direction:column;align-items:stretch;}\n  .ddc .cap{padding:0 18px 14px;font-size:12.5px;color:var(--text-3);line-height:1.5;}\n\n  .callout{display:flex;gap:12px;align-items:flex-start;background:var(--navy);color:#eaf1f8;border-radius:var(--r-lg);padding:18px 20px;margin-top:18px;}\n  .callout svg{width:20px;height:20px;flex:none;color:var(--pink);margin-top:1px;}\n  .callout .ct{font-family:var(--display);font-weight:600;font-size:15px;color:#fff;}\n  .callout .cd{font-size:13.5px;color:#aec4d6;line-height:1.55;margin-top:3px;}\n\n  /* checklist */\n  .checklist{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:8px 20px;box-shadow:var(--shadow-xs);}\n  .ck{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--gray-100);}\n  .checklist .ck:last-child{border-bottom:0;}\n  .ck .cb{width:19px;height:19px;border-radius:var(--r-xs);border:1.5px solid var(--blue);background:var(--blue-50);display:grid;place-items:center;flex:none;margin-top:1px;}\n  .ck .cb svg{width:12px;height:12px;color:var(--blue-700);}\n  .ck .cx{font-size:14px;color:var(--text);}\n  .ck .cx b{color:var(--navy);}\n  .ck .cx span{color:var(--text-3);}\n\n  @media print{\n    body{background:#fff;}\n    .doc-top{position:static;}\n    .rule,.princ,.ddc,.checklist{break-inside:avoid;}\n    .h-sec{break-after:avoid;}\n  }\n  @media (max-width:720px){.principles,.dd{grid-template-columns:1fr;}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"doc\">\n\n  <div class=\"doc-top\">\n    <img src=\"25d66d47-166a-4e4a-b5d7-81680b5eef3d\" alt=\"Tchilla\">\n    <div class=\"nm\">Tchilla Admin<small>UI / UX<\u002Fsmall><\u002Fdiv>\n    <span class=\"pg\">Regras de experiência · v1.0<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"cover\">\n    <div class=\"ey\">Princípios &amp; Regras<\u002Fdiv>\n    <h1>Como construir uma boa<br>experiência no Tchilla Admin<\u002Fh1>\n    <p>Estas regras traduzem o design system em decisões do dia-a-dia. O objetivo é simples: um funcionário deve conseguir gerir reservas, espaços e pagamentos com <b>rapidez, confiança e zero ambiguidade<\u002Fb>. Quando houver dúvida, volte aos princípios.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- PRINCÍPIOS -->\n  <div class=\"h-sec\"><span class=\"n\">01<\u002Fspan><h2>Princípios<\u002Fh2><\u002Fdiv>\n  <div class=\"principles\">\n    <div class=\"princ\" data-n=\"1\"><div class=\"pt\">Clareza antes de densidade<\u002Fdiv><div class=\"pd\">A interface é compacta para mostrar muito — mas cada ecrã responde primeiro a uma pergunta: <i>“o que preciso de decidir agora?”<\u002Fi>. Densidade nunca à custa de leitura.<\u002Fdiv><div class=\"pk\">Decisão primeiro<\u002Fdiv><\u002Fdiv>\n    <div class=\"princ\" data-n=\"2\"><div class=\"pt\">Azul age, Rosa aponta<\u002Fdiv><div class=\"pd\">A cor é função, não enfeite. O azul conduz a ação principal; o rosa é um holofote pontual (promoção, favorito, destaque). Tudo o resto é neutro.<\u002Fdiv><div class=\"pk\">Cor = função<\u002Fdiv><\u002Fdiv>\n    <div class=\"princ\" data-n=\"3\"><div class=\"pt\">O estado nunca é ambíguo<\u002Fdiv><div class=\"pd\">Toda reserva e todo pagamento mostram o seu estado, sempre, com palavra + cor + forma. O utilizador nunca adivinha em que ponto algo está.<\u002Fdiv><div class=\"pk\">Sempre visível<\u002Fdiv><\u002Fdiv>\n    <div class=\"princ\" data-n=\"4\"><div class=\"pt\">Defaults que poupam trabalho<\u002Fdiv><div class=\"pd\">O sistema sugere, pré-preenche e lembra a última escolha. A tarefa comum deve custar o mínimo de cliques; o caso raro é que pede esforço.<\u002Fdiv><div class=\"pk\">Menos cliques<\u002Fdiv><\u002Fdiv>\n    <div class=\"princ\" data-n=\"5\"><div class=\"pt\">Erros são reversíveis<\u002Fdiv><div class=\"pd\">Ações destrutivas pedem confirmação e oferecem <i>desfazer<\u002Fi>. Preferimos prevenir o erro a culpar o utilizador depois dele.<\u002Fdiv><div class=\"pk\">Confirmar + desfazer<\u002Fdiv><\u002Fdiv>\n    <div class=\"princ\" data-n=\"6\"><div class=\"pt\">Velocidade que se sente<\u002Fdiv><div class=\"pd\">Resposta imediata a cada toque: skeletons no carregamento, atualização otimista, confirmação discreta. Esperar sem sinal é o pior estado.<\u002Fdiv><div class=\"pk\">Feedback imediato<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- REGRAS: COR -->\n  <div class=\"h-sec\"><span class=\"n\">02<\u002Fspan><h2>Cor &amp; hierarquia<\u002Fh2><\u002Fdiv>\n\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R1<\u002Fspan><div><div class=\"rt\">Uma só ação primária por ecrã<\u002Fdiv><div class=\"rp\">O azul marca <b>a<\u002Fb> ação que queremos que aconteça. Se tudo é primário, nada é. As outras ações ficam secundárias ou fantasma.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"dd\">\n      <div class=\"ddc do\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg>Faça<\u002Fdiv><div class=\"bd\"><button class=\"btn btn-primary\">Confirmar reserva<\u002Fbutton><button class=\"btn btn-secondary\">Guardar rascunho<\u002Fbutton><button class=\"btn btn-ghost\">Cancelar<\u002Fbutton><\u002Fdiv><div class=\"cap\">Uma ação azul, o resto em tons neutros. O olho sabe para onde ir.<\u002Fdiv><\u002Fdiv>\n      <div class=\"ddc dont\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>Evite<\u002Fdiv><div class=\"bd\"><button class=\"btn btn-primary\">Confirmar<\u002Fbutton><button class=\"btn btn-accent\">Guardar<\u002Fbutton><button class=\"btn btn-dark\">Editar<\u002Fbutton><\u002Fdiv><div class=\"cap\">Três cores fortes competindo. A hierarquia desaparece e o rosa perde o impacto.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R2<\u002Fspan><div><div class=\"rt\">Rosa com parcimónia<\u002Fdiv><div class=\"rp\">O rosa é o acento da marca — vale pelo contraste. Use-o em <b>promoção, favorito e destaque<\u002Fb>. Se aparecer em todo o lado, deixa de chamar a atenção.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"dd\">\n      <div class=\"ddc do\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg>Faça<\u002Fdiv><div class=\"bd\"><span class=\"badge b-solid-pink\">🔥 Promoção<\u002Fspan><span class=\"badge b-neutral\">Salão<\u002Fspan><span class=\"badge b-neutral\">300 pax<\u002Fspan><span class=\"badge b-success\"><span class=\"dotb\"><\u002Fspan>Confirmada<\u002Fspan><\u002Fdiv><div class=\"cap\">Um único acento rosa entre elementos neutros — salta de imediato.<\u002Fdiv><\u002Fdiv>\n      <div class=\"ddc dont\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>Evite<\u002Fdiv><div class=\"bd\"><span class=\"badge b-solid-pink\">Salão<\u002Fspan><span class=\"badge b-accent\">300 pax<\u002Fspan><span class=\"badge b-solid-pink\">🔥 Promo<\u002Fspan><span class=\"badge b-accent\">Nova<\u002Fspan><\u002Fdiv><div class=\"cap\">Rosa em tudo: vira ruído visual e nada se destaca de facto.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8h.01M11 12h1v4h1\"><\u002Fpath><\u002Fsvg><div><div class=\"ct\">Regra dos 60-30-10<\u002Fdiv><div class=\"cd\">Cerca de 60% neutros (superfícies e texto), 30% azul (estrutura e ação) e no máximo 10% rosa (acento). Se passar disso, recue.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n  <!-- REGRAS: DADOS -->\n  <div class=\"h-sec\"><span class=\"n\">03<\u002Fspan><h2>Tabelas &amp; dados<\u002Fh2><\u002Fdiv>\n\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R3<\u002Fspan><div><div class=\"rt\">Números alinhados à direita, tabulares<\u002Fdiv><div class=\"rp\">Valores em Kwanza e contagens alinham à <b>direita<\u002Fb> com algarismos tabulares, para comparar de relance. Texto alinha à esquerda.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"dd\">\n      <div class=\"ddc do\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg>Faça<\u002Fdiv><div class=\"bd col\" style=\"gap:0;\">\n        <div class=\"between\" style=\"padding:5px 0;border-bottom:1px solid var(--gray-100)\"><span style=\"font-size:13px\">Costela D'Ouro<\u002Fspan><span class=\"num\" style=\"font-size:13px\">835.000,00 Kz<\u002Fspan><\u002Fdiv>\n        <div class=\"between\" style=\"padding:5px 0;border-bottom:1px solid var(--gray-100)\"><span style=\"font-size:13px\">Kilamba<\u002Fspan><span class=\"num\" style=\"font-size:13px\">350.000,00 Kz<\u002Fspan><\u002Fdiv>\n        <div class=\"between\" style=\"padding:5px 0\"><span style=\"font-size:13px\">Marginal<\u002Fspan><span class=\"num\" style=\"font-size:13px\">1.200.000,00 Kz<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv><div class=\"cap\">Casas decimais e milhares alinham na vertical — fácil de somar com o olho.<\u002Fdiv><\u002Fdiv>\n      <div class=\"ddc dont\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>Evite<\u002Fdiv><div class=\"bd col\" style=\"gap:0;font-family:var(--text-font)\">\n        <div style=\"padding:5px 0;border-bottom:1px solid var(--gray-100);font-size:13px\">Costela D'Ouro — Kz 835000<\u002Fdiv>\n        <div style=\"padding:5px 0;border-bottom:1px solid var(--gray-100);font-size:13px\">Kilamba — 350.000 kwanzas<\u002Fdiv>\n        <div style=\"padding:5px 0;font-size:13px\">Marginal — 1200000,00<\u002Fdiv>\n      <\u002Fdiv><div class=\"cap\">Formatos misturados e à esquerda: impossível comparar valores.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R4<\u002Fspan><div><div class=\"rt\">Estado com palavra + cor + forma<\u002Fdiv><div class=\"rp\">Nunca comunique estado só por cor (há daltonismo e ecrãs maus). Combine sempre <b>rótulo de texto<\u002Fb>, cor semântica e um ponto/ícone.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"dd\">\n      <div class=\"ddc do\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg>Faça<\u002Fdiv><div class=\"bd\"><span class=\"badge b-warning\"><span class=\"dotb\"><\u002Fspan>Pendente<\u002Fspan><span class=\"badge b-success\"><span class=\"dotb\"><\u002Fspan>Confirmada<\u002Fspan><span class=\"badge b-danger\"><span class=\"dotb\"><\u002Fspan>Cancelada<\u002Fspan><\u002Fdiv><div class=\"cap\">Texto + cor + ponto. Legível mesmo a preto e branco.<\u002Fdiv><\u002Fdiv>\n      <div class=\"ddc dont\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>Evite<\u002Fdiv><div class=\"bd\"><span style=\"width:13px;height:13px;border-radius:50%;background:var(--warning)\"><\u002Fspan><span style=\"width:13px;height:13px;border-radius:50%;background:var(--success)\"><\u002Fspan><span style=\"width:13px;height:13px;border-radius:50%;background:var(--danger)\"><\u002Fspan><\u002Fdiv><div class=\"cap\">Só a cor. Quem não distingue, ou imprime a P&amp;B, fica sem saber.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R5<\u002Fspan><div><div class=\"rt\">Ações da linha aparecem no contexto<\u002Fdiv><div class=\"rp\">Ações por linha (editar, cancelar) surgem ao passar o rato e concentram-se num menu “⋯”, mantendo a tabela limpa. A ação em massa aparece quando há seleção.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"callout\" style=\"background:var(--blue-50);color:var(--navy);margin-top:14px;\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue-700)\" stroke-width=\"2\"><path d=\"M4 6h16M4 12h16M4 18h10\"><\u002Fpath><\u002Fsvg><div><div class=\"ct\" style=\"color:var(--navy)\">Densidade alvo<\u002Fdiv><div class=\"cd\" style=\"color:var(--text-2)\">Linhas de <b>34px<\u002Fb> (compacto) mostram ~18 reservas sem rolar. Ofereça o modo “confortável” (44px) para sessões longas — está nos Tweaks.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- REGRAS: ESTADOS -->\n  <div class=\"h-sec\"><span class=\"n\">04<\u002Fspan><h2>Estados &amp; feedback<\u002Fh2><\u002Fdiv>\n\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R6<\u002Fspan><div><div class=\"rt\">Todo ecrã prevê vazio, carregamento e erro<\u002Fdiv><div class=\"rp\">Antes de “pronto”, desenhe os outros três estados. Um vazio com próxima ação evita o beco sem saída; um skeleton mata a sensação de lentidão.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"dd\">\n      <div class=\"ddc do\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg>Faça<\u002Fdiv><div class=\"bd center\" style=\"min-height:120px;\"><div class=\"empty\" style=\"padding:6px\"><div class=\"ei\" style=\"width:42px;height:42px;margin-bottom:9px\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M3 10h18M9 4v16\"><\u002Fpath><\u002Fsvg><\u002Fdiv><h4 style=\"font-size:14px\">Sem reservas<\u002Fh4><p style=\"font-size:12px\">Crie a primeira para este filtro.<\u002Fp><button class=\"btn btn-primary sm\" style=\"margin-top:10px\">Nova reserva<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"cap\">Vazio explica o porquê e oferece o passo seguinte.<\u002Fdiv><\u002Fdiv>\n      <div class=\"ddc dont\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>Evite<\u002Fdiv><div class=\"bd center\" style=\"min-height:120px;\"><span class=\"note\" style=\"font-size:13px\">Nenhum resultado.<\u002Fspan><\u002Fdiv><div class=\"cap\">Um beco sem saída. O utilizador não sabe se falhou algo ou o que fazer.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R7<\u002Fspan><div><div class=\"rt\">Sucesso é discreto; erro é específico<\u002Fdiv><div class=\"rp\">Confirmação de sucesso vai num <b>toast<\u002Fb> que desaparece. Erro fica <b>inline<\u002Fb>, junto ao campo ou ação, dizendo o que correu mal e como resolver — nunca um alerta genérico.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"dd\">\n      <div class=\"ddc do\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg>Faça<\u002Fdiv><div class=\"bd col\">\n        <div class=\"toast\" style=\"width:100%\"><span class=\"ti\" style=\"background:var(--success-bg);color:var(--success)\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><div class=\"tt\">Reserva confirmada<\u002Fdiv><div class=\"td\">Cliente notificado por SMS.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><input class=\"input is-error\" value=\"nadia@@mail\" style=\"height:30px\"><span class=\"hint err\">Email inválido — falta o domínio (ex.: nome@mail.com).<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv><div class=\"cap\">Sucesso passageiro, erro preciso e acionável onde aconteceu.<\u002Fdiv><\u002Fdiv>\n      <div class=\"ddc dont\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>Evite<\u002Fdiv><div class=\"bd col\" style=\"justify-content:center\"><div class=\"alert alert-danger\" style=\"font-size:12.5px\"><span class=\"ai\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5M12 16h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><div class=\"at\">Erro<\u002Fdiv>Ocorreu um problema. Tente novamente.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"cap\">“Erro” genérico não diz o quê nem onde. Frustra e não resolve.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- REGRAS: AÇÕES & FORMS -->\n  <div class=\"h-sec\"><span class=\"n\">05<\u002Fspan><h2>Ações, formulários &amp; fluxo<\u002Fh2><\u002Fdiv>\n\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R8<\u002Fspan><div><div class=\"rt\">Destrutivo confirma e deixa desfazer<\u002Fdiv><div class=\"rp\">Cancelar uma reserva ou apagar um espaço pede confirmação que <b>nomeia o item<\u002Fb> e as consequências. Sempre que possível, ofereça “desfazer” por alguns segundos em vez de só perguntar.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"dd\">\n      <div class=\"ddc do\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg>Faça<\u002Fdiv><div class=\"bd center\"><div class=\"modal\" style=\"width:100%;box-shadow:none;border:1px solid var(--border)\"><div class=\"modal-h\" style=\"padding:13px 14px 10px\"><span class=\"mi\" style=\"background:var(--danger-bg);color:var(--danger);width:30px;height:30px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><path d=\"M12 9v4M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><h4 style=\"font-size:15px\">Cancelar #TCH-0412?<\u002Fh4><p>O cliente Ana Lúcia será notificado e o sinal devolvido.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"modal-f\" style=\"padding:10px 14px\"><button class=\"btn btn-ghost sm\">Voltar<\u002Fbutton><button class=\"btn btn-danger sm\">Sim, cancelar<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"cap\">Nomeia a reserva, o cliente e a consequência. Decisão informada.<\u002Fdiv><\u002Fdiv>\n      <div class=\"ddc dont\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>Evite<\u002Fdiv><div class=\"bd center\"><button class=\"btn btn-danger\">Apagar<\u002Fbutton><\u002Fdiv><div class=\"cap\">Apagar imediato, sem aviso nem volta. Um clique errado custa caro.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R9<\u002Fspan><div><div class=\"rt\">Rótulo acima, validação no momento certo<\u002Fdiv><div class=\"rp\">Rótulo sempre <b>visível acima<\u002Fb> do campo (nunca só placeholder). Valide ao sair do campo, não a cada tecla. Marque o obrigatório e mostre o formato esperado.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"dd\">\n      <div class=\"ddc do\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg>Faça<\u002Fdiv><div class=\"bd col\"><div class=\"field\"><label class=\"label\">Telefone <span class=\"req\">*<\u002Fspan><\u002Flabel><input class=\"input\" value=\"+244 923 000 000\" style=\"height:30px\"><span class=\"hint\">Formato: +244 9XX XXX XXX<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"cap\">Rótulo persistente, obrigatório marcado, formato exemplificado.<\u002Fdiv><\u002Fdiv>\n      <div class=\"ddc dont\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>Evite<\u002Fdiv><div class=\"bd col\" style=\"justify-content:center\"><input class=\"input\" placeholder=\"Telefone\" style=\"height:30px\"><\u002Fdiv><div class=\"cap\">Só placeholder: desaparece ao escrever e não diz o formato.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R10<\u002Fspan><div><div class=\"rt\">Diga sempre onde estou e quanto falta<\u002Fdiv><div class=\"rp\">Breadcrumb e título dizem a localização; processos longos (criar reserva) mostram passos. O utilizador nunca se sente perdido nem surpreendido pelo fim.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"dd\">\n      <div class=\"ddc do\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg>Faça<\u002Fdiv><div class=\"bd col\"><div class=\"crumb\" style=\"font-size:12px\"><a href=\"#\">Reservas<\u002Fa><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"m9 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><b>Nova<\u002Fb><\u002Fdiv><div class=\"seg\"><button class=\"on\">1. Espaço<\u002Fbutton><button>2. Cliente<\u002Fbutton><button>3. Pagamento<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"cap\">Localização clara e progresso explícito no fluxo.<\u002Fdiv><\u002Fdiv>\n      <div class=\"ddc dont\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>Evite<\u002Fdiv><div class=\"bd col\" style=\"justify-content:center\"><div class=\"field\"><input class=\"input\" placeholder=\"Dados…\" style=\"height:30px\"><\u002Fdiv><\u002Fdiv><div class=\"cap\">Um formulário gigante sem contexto nem noção de quanto falta.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- MICROCOPY -->\n  <div class=\"h-sec\"><span class=\"n\">06<\u002Fspan><h2>Tom &amp; microcopy<\u002Fh2><\u002Fdiv>\n  <div class=\"rule\">\n    <div class=\"rule-h\"><span class=\"rn\">R11<\u002Fspan><div><div class=\"rt\">Português de Angola, direto e humano<\u002Fdiv><div class=\"rp\">Botões começam por verbo (“Confirmar reserva”, não “Submeter”). Mensagens falam com a pessoa, sem jargão técnico. Datas e moeda no formato local.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"dd\">\n      <div class=\"ddc do\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg>Faça<\u002Fdiv><div class=\"bd col\" style=\"gap:8px;font-size:13px\">\n        <div class=\"row\" style=\"gap:8px\"><button class=\"btn btn-primary sm\">Confirmar reserva<\u002Fbutton><button class=\"btn btn-secondary sm\">Guardar rascunho<\u002Fbutton><\u002Fdiv>\n        <div class=\"num\" style=\"font-size:13px\">14 Jun 2026 · 835.000,00 Kz<\u002Fdiv>\n      <\u002Fdiv><div class=\"cap\">Verbo + objeto, datas e Kwanza no formato de Angola.<\u002Fdiv><\u002Fdiv>\n      <div class=\"ddc dont\"><div class=\"hd\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>Evite<\u002Fdiv><div class=\"bd col\" style=\"gap:8px;font-size:13px\">\n        <div class=\"row\" style=\"gap:8px\"><button class=\"btn btn-primary sm\">Submeter<\u002Fbutton><button class=\"btn btn-secondary sm\">OK<\u002Fbutton><\u002Fdiv>\n        <div style=\"font-size:13px;font-family:var(--text-font)\">2026-06-14 · AOA 835000.00<\u002Fdiv>\n      <\u002Fdiv><div class=\"cap\">Verbos vagos e formatos de sistema, frios e ambíguos.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ACESSIBILIDADE -->\n  <div class=\"h-sec\"><span class=\"n\">07<\u002Fspan><h2>Acessibilidade · mínimos<\u002Fh2><\u002Fdiv>\n  <div class=\"principles\">\n    <div class=\"princ\" data-n=\"A\"><div class=\"pt\">Contraste AA<\u002Fdiv><div class=\"pd\">Texto normal ≥ 4,5:1. Lembre: branco reprova no azul vivo — use texto <b>marinho<\u002Fb> sobre o azul, ou o azul profundo com branco.<\u002Fdiv><\u002Fdiv>\n    <div class=\"princ\" data-n=\"B\"><div class=\"pt\">Foco sempre visível<\u002Fdiv><div class=\"pd\">Todo elemento interativo mostra um anel de foco azul ao navegar por teclado. Nunca remover o <span class=\"mono\">:focus<\u002Fspan> sem substituir.<\u002Fdiv><\u002Fdiv>\n    <div class=\"princ\" data-n=\"C\"><div class=\"pt\">Alvos ≥ 40px<\u002Fdiv><div class=\"pd\">Botões e linhas clicáveis com área de toque confortável. Ícones-ação isolados nunca abaixo de 32px.<\u002Fdiv><\u002Fdiv>\n    <div class=\"princ\" data-n=\"D\"><div class=\"pt\">Nunca só a cor<\u002Fdiv><div class=\"pd\">Estado, erro e seleção carregam também texto, ícone ou forma — para daltonismo e impressão a P&amp;B.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CHECKLIST -->\n  <div class=\"h-sec\"><span class=\"n\">08<\u002Fspan><h2>Checklist antes de entregar um ecrã<\u002Fh2><\u002Fdiv>\n  <div class=\"checklist\">\n    <div class=\"ck\"><span class=\"cb\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cx\"><b>Uma ação primária<\u002Fb> clara em azul; secundárias contidas. <span>O olho sabe o próximo passo.<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div class=\"ck\"><span class=\"cb\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cx\"><b>Estados desenhados:<\u002Fb> vazio, carregamento e erro, não só o “feliz”.<\u002Fspan><\u002Fdiv>\n    <div class=\"ck\"><span class=\"cb\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cx\"><b>Estado de cada item<\u002Fb> com texto + cor + forma. <span>Nada comunicado só por cor.<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div class=\"ck\"><span class=\"cb\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cx\"><b>Números à direita<\u002Fb>, tabulares, em Kwanza com 2 casas e milhares.<\u002Fspan><\u002Fdiv>\n    <div class=\"ck\"><span class=\"cb\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cx\"><b>Ações destrutivas<\u002Fb> confirmam, nomeiam o item e (idealmente) deixam desfazer.<\u002Fspan><\u002Fdiv>\n    <div class=\"ck\"><span class=\"cb\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cx\"><b>Rótulos acima<\u002Fb> dos campos, obrigatórios marcados, formato exemplificado.<\u002Fspan><\u002Fdiv>\n    <div class=\"ck\"><span class=\"cb\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cx\"><b>Onde estou<\u002Fb> visível (breadcrumb/título) e progresso em fluxos longos.<\u002Fspan><\u002Fdiv>\n    <div class=\"ck\"><span class=\"cb\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cx\"><b>Rosa ≤ 10%<\u002Fb> do ecrã, só em acento real. <span>Sem rosa decorativo.<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div class=\"ck\"><span class=\"cb\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cx\"><b>Teclado e foco<\u002Fb> funcionam; contraste AA; alvos confortáveis.<\u002Fspan><\u002Fdiv>\n    <div class=\"ck\"><span class=\"cb\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"cx\"><b>Microcopy<\u002Fb> em PT-Angola, verbos diretos, datas e Kz locais.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer style=\"margin-top:48px;padding-top:18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:12px;\">\n    <img src=\"25d66d47-166a-4e4a-b5d7-81680b5eef3d\" style=\"height:24px;width:auto;\">\n    <span>Tchilla Admin · Regras de UI/UX v1.0<\u002Fspan>\n    <span style=\"margin-left:auto\" class=\"mono\">Clareza · Confiança · Velocidade<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
